<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='6' cy='6' r='3'/><circle cx='6' cy='18' r='3'/><line x1='20' y1='4' x2='8.12' y2='15.88'/><line x1='14.47' y1='14.48' x2='20' y2='20'/><line x1='8.12' y1='8.12' x2='12' y2='12'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BarberOS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BarberOS" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>BarberOS · Control Financiero & Caja</title>
    <script>
      (function() {
        // 1. Brand customizer
        try {
          var h = window.location.hostname.toLowerCase();
          var p = new URLSearchParams(window.location.search);
          var b = (p.get('brand') || p.get('app') || '').toLowerCase();
          var isGlam = h.includes('glam') || b.includes('glam');
          if (isGlam) {
            document.title = 'GlamOS · Salones de Belleza, Uñas & Spas';
            var appName = document.querySelector('meta[name="application-name"]');
            if (appName) appName.setAttribute('content', 'GlamOS');
            var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) appleTitle.setAttribute('content', 'GlamOS');
            var themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) themeColor.setAttribute('content', '#ec4899');
            var iconLink = document.querySelector('link[rel="icon"]');
            if (iconLink) iconLink.setAttribute('href', '/icon-glamos.svg');
            var manifestLink = document.querySelector('link[rel="manifest"]');
            if (manifestLink) manifestLink.setAttribute('href', '/manifest.webmanifest?brand=glamos');
          }
        } catch (e) {}

        // 2. Self-healing fallback: if any chunk hash 404s due to a new deployment, auto-purge cache and reload!
        window.addEventListener('error', function(e) {
          if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var url = e.target.src || e.target.href || '';
            if (url.indexOf('/assets/') !== -1 && 'serviceWorker' in navigator) {
              console.warn('Recovering from stale chunk cache:', url);
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
                if ('caches' in window) {
                  caches.keys().then(function(keys) {
                    keys.forEach(function(k) { caches.delete(k); });
                    window.location.reload();
                  });
                }
              });
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-dark-950 text-slate-100 antialiased selection:bg-gold-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
